<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Job Scrapper</title>
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
</head>
<body>
<main class="container">
     <h1>Job Scrapper</h1>

     <form action="/search">

         <button>Search</button>
     </form>
</main>
</body>
</html>
